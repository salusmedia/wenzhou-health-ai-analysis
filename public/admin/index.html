<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c2d12" />
  <title>AI 安全监管台 · 健康温州</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body.admin{background:#f4f5f7}
    .adm-wrap{max-width:920px;margin:0 auto;padding:18px}
    .adm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .adm-head h1{font-size:20px;color:#7c2d12;margin:0}
    .metric{display:flex;gap:12px;flex-wrap:wrap}
    .metric .m{flex:1;min-width:130px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-align:center}
    .metric .m b{font-size:24px;display:block;color:#16324f}
    .metric .m span{font-size:12px;color:#64748b}
    .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px}
    .pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fee2e2;color:#991b1b}
    .case{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
    .ok{color:#166534}.bad{color:#b91c1c}
    .login-box{max-width:340px;margin:80px auto;background:#fff;border-radius:14px;padding:26px;text-align:center;border:1px solid #e5e7eb}
    .login-box input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin:10px 0;font-size:15px}
  </style>
</head>
<body class="admin">
  <div id="app" class="adm-wrap"></div>
  <div class="toast" id="toast"></div>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
