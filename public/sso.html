<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在进入 · 健康温州</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(150deg,#0ea5a4,#22c1a8);
    color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .logo{font-size:52px}.tip{font-size:14px;opacity:.9}
  .sp{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}} a{color:#fff}
</style>
</head>
<body>
  <div class="logo">🩺</div><div class="sp"></div>
  <div class="tip" id="tip">正在免登进入…</div>
<script>
(async function () {
  var q = new URLSearchParams(location.search);
  var role = q.get('role') || 'doctor';
  var pc = q.get('pc') === '1';
  function post(path, body) {
    return fetch('/api/auth' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || '登录失败'); return j; }); });
  }
  try {
    if (role === 'patient') {
      var pd = await post('/patient/login', {});
      localStorage.setItem('wz_patient_token', pd.token);
      if (pd.patient) localStorage.setItem('wz_patient', JSON.stringify(pd.patient));
      location.replace('/');
    } else if (role === 'qc' || role === 'admin') {
      var ad = await post('/admin/login', { key: 'admin123' });
      localStorage.setItem('wz_admin_token', ad.token);
      location.replace('/admin');
    } else if (role === 'hospital') {
      location.replace('/hospital');
    } else {
      var dd = await post('/doctor/login', { login: 'doctor', password: '123456' });
      localStorage.setItem('wz_doctor_token', dd.token);
      if (dd.doctor) localStorage.setItem('wz_doctor', JSON.stringify(dd.doctor));
      location.replace(pc ? '/doctor' : '/doctor');
    }
  } catch (e) {
    document.getElementById('tip').innerHTML = '免登失败：' + (e.message || '') + '　<a href="/doctor">手动登录</a>';
  }
})();
</script>
</body>
</html>
