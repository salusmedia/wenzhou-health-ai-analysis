<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>HI 医生 · AI 云医院医护端</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/doctor/css/doctor.css" />
</head>
<body class="doc">
  <div id="app">
    <div class="phone">
      <header class="topbar" id="topbar">
        <div class="topbar-left" id="topbarBack">‹</div>
        <div class="topbar-title" id="topbarTitle">HI 医生</div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>
      <main class="screen" id="screen"></main>
      <nav class="tabbar" id="tabbar">
        <div class="tab active" data-tab="home"><span class="ti">🏠</span><span>工作台</span></div>
        <div class="tab" data-tab="consults"><span class="ti">🩺</span><span>接诊/同屏</span></div>
        <div class="tab" data-tab="patients"><span class="ti">👥</span><span>我的患者</span></div>
        <div class="tab" data-tab="earnings"><span class="ti">💰</span><span>解读收入</span></div>
      </nav>
    </div>
  </div>
  <div class="modal-mask" id="modalMask"></div>
  <div class="toast" id="toast"></div>
  <script src="/doctor/js/doctor.js"></script>
</body>
</html>
