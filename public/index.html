<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#096DD9" />
  <title>健康温州 · AI 智慧健康</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <div class="phone">
      <!-- 顶部状态栏 -->
      <header class="topbar" id="topbar">
        <div class="topbar-left" id="topbarBack">‹</div>
        <div class="topbar-title" id="topbarTitle">健康温州</div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>

      <!-- 页面容器 -->
      <main class="screen" id="screen"></main>

      <!-- 底部导航 -->
      <nav class="tabbar" id="tabbar">
        <div class="tab active" data-tab="records"><span class="ti">🗂️</span><span>健康档案</span></div>
        <div class="tab" data-tab="assistant"><span class="ti">💬</span><span>AI助理</span></div>
        <div class="tab" data-tab="reports"><span class="ti">📄</span><span>健康报告</span></div>
        <div class="tab" data-tab="mine"><span class="ti">👤</span><span>我的</span></div>
      </nav>
    </div>
  </div>

  <!-- 全局弹层 -->
  <div class="modal-mask" id="modalMask"></div>
  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
